<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    .box {
        border: 2px solid blue;
        padding: 0;
        display: inline-block;
        width: 344px;
        padding: 45px;
        margin: 34px;
    }
    .box1{
         display:inline-flex;
      
    }
</style>

<body>
    <div class="box box1">
        I am a box
    </div>
    
    <div>
        I am also
    </div>
    <div class="box">
        a box
    </div>
</body>

</html>
