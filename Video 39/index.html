<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container{
            border:2px solid black;
            display:grid;
            grid-template-columns: [Phela]120px [doosra]100px;
            grid-template: 100px 100px 100px;
            justify-items:center;
            align-items:center;
            height: 300px;
        }
        .item{
            border: 2px solid chocolate;
            height: 55px;
            width: 55px;
        }
        .item-4{
            /* grid-column: Phela / doosra;
            grid-row: 2 / 4; */
            align-self: end;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
    </div>
</body>
</html>
