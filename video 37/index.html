    <title>CSS FlexBox</title>
    <style>
        .container1 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
        }

        .container2 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            width: auto;
            flex-grow: 3;
        }

        .container3 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            /* justify-content: center; */
            align-items: center;
            margin: 10px;
            flex-direction: row-reverse;
            width: auto;
        }

        .container4 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .container5 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            margin: 10px;
            flex-wrap: wrap;
        }

        /* There is no justify-content property in the below container. So, the default value of justify-content is flex-start. So, all the items are aligned to the left side of the container.
        */
        .container6 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            flex-direction: row;
            margin: 10px;
            flex-wrap: wrap-reverse;
        }

        .container7 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            flex-direction: row;
            margin: 10px;
            flex-flow: row-reverse;
            gap: 00px;
        }

        .container8 {
            border: 2px solid red;
            height: 200px;
            display: flex;
            flex-direction: row;
            margin: 10px;
            flex-wrap: wrap;
            row-gap: 5px;
            column-gap: 1px;
        }

        .item {
            height: 32px;
            width: 32px;
            border: 1px solid black;
            margin: 4px;
            background-color: blueviolet
        }
        .item1 {
            /* flex-grow: 5; */
            flex-shrink: 2;
