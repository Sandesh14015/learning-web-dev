<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Excercise</title>
    <style>
        body{
            background-color: rgb(214, 135, 228);
            margin: 0;
            padding: 0;
        }
        header{
             position: sticky;
            top:0;
        }
        nav{
           background-color: rgb(125, 13, 228);
           height: 10vh;
          

        }
      .container{
           margin: 20px 30px ;
           height: 70vh;
           display: flex;
          
        }
        .item{
            background-color: rgb(42, 10, 198);
           
           
            
          
        }
        .Box1{
            background-color: rgb(58, 3, 98);
              width: 50%;
              height: 70vh;
               display: inline-block;
                margin:0px 12px; 
        }
        .Box2{
            background-color: rgb(3, 13, 74);
              width: 50%;
              height: 70vh;
               display: inline-block;
                margin:0px 12px; 
        } 
        footer{
            background-color: rgb(125, 13, 228);
            height: 10vh;
            margin: 0;
            padding: 0;
        }
    </style> 
</head>
<body>
    <header>
        <nav>
           
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="item Box2">1</div>
            <div class="item Box1">2</div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
