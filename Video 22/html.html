<!DOCTYPE html>
<html lang="en">
<head>
    <title>Percentage Unit Example</title>

    <style>
        .container{
            width: 600px;
            height: 300px;
            border: 2px solid black;
            background-color: lightgray;
        }

        .box{

            border: 2px solid black;
           
            height: 50%;         /* 50% of the parent's height */
            background-color: steelblue;
        }
        .small{
            border: 2px solid black;
          
            height: 50%;         /* 50% of the parent's height */
            background-color: rgb(219, 16, 16);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            <div class="small"></div>
        </div>
    </div>

</body>
</html>
