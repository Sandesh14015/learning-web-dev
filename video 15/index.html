<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Ways to add CSS</title>
    <style>
        li {
            color: red;
        }
    </style>
    <link rel="stylesheet" href="style.css">
        
</head>
<body>
    <h1 style="color: blue">This is an inline style</h1>
    <li>THIS IS AN INTERNAL CSS</li>
    <li>THIS IS TOO INTERNAL CSS</li>
    <span>
        <h3>
            THIS IS AN EXTERNAL CSS
        </h3>
    </span>

</body>
</html>
