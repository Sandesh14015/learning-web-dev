<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    body {
        background-color: grey;
        padding: 45px;
    }

    .Card {
        height: 455px;
        width: 344px;
        background-color: white;
        margin: 10px;
        padding: 10px;
        border-radius: 7px;
    }

    .image {
        padding: 0%;
    }

    .image {
        border-radius: 7px;
        height: 200px;
        width: 100%;
    }

    .content {
        padding: 10px;
        font-family: "Poppins", sans-serif;
        font-weight: 100;
        font-style: normal;
    }

    .content h2 {
        margin-bottom: 10px;
    }

    .capsules {
        margin: 3px;
        padding: 0 34px;
        position: relative;
        font-family: "Poppins", sans-serif;
    }

    .capsules span {
        border: 1px solid grey;
        border-radius: 7px;
        padding: 0 4px 0 4px;
        color: grey
    }

    .button {
        text-align: center;
    }

    .button button {
        background-color: #065fd4;
        color: #ffffff;
        font-family: "Roboto", "Arial", sans-serif;
        font-size: 14px;
        font-weight: 500;
        padding: 0 16px;
        height: 36px;
        border: none;
        border-radius: 18px;
        cursor: pointer;
        outline: none;
        transition: background-color 0.2s ease;
    }
</style>

<body>
    <div class="Card">
        <div class="Image">
            <img src="10-dithering-opt.jpg" alt="Image" class="image">
        </div>
        <div class="capsules">
            <span>Bird</span>
            <span>Photography</span>
        </div>
        <div class="content">
            <h2>Sandesh</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ex reprehenderit minima, deleniti molestias aut,
                quis obcaecati unde libero cumque architecto quas? Itaque rerum amet necessitatibus similique
                repellendus neque repellat laborum nesciunt earum, aperiam quas!</p>
        </div>
        <div class="button">
            <button>Submit</button>
        </div>
    </div>
</body>

</html>
